name: Build Puck

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl make clang dpkg-dev fakeroot xz-utils file

      - name: 安装 Theos
        run: |
          export THEOS=$HOME/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 克隆 Puck 源码
        run: git clone https://github.com/LittenArchive/Puck.git

      - name: 编译 Puck
        run: |
          cd Puck
          make clean package FINALPACKAGE=1

      - name: 上传 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: puck-deb
          path: Puck/packages/*.deb
